<!-- COMPONENTE: MENUS OPERACIONAIS (ADMIN E MOTORISTA) -->
<section id="view-admin-hub" class="view-section">
  <div class="welcome-text welcome-row">
    <span>Bem-vindo, <span id="nome-operador-logado"
        class="welcome-operator-name">Operador</span></span>
  </div>

  <div id="menu-grupo-campo" class="grid-desktop">
    <button class="menu-card dark-card" data-maestro-action="fiscalizar" onclick="switchView('view-fiscal')">
      <span class="icon">🛂</span>
      <div class="info">
        <strong>Modo Fiscalização</strong>
        <span>Validar identidades com QR Code</span>
      </div>
    </button>

    <button class="menu-card outline-card menu-card-accent" data-maestro-action="encerrarRota"
      onclick="abrirModalEncerrarRota()">
      <span class="icon menu-card-icon-no-bg">🏁</span>
      <div class="info">
        <strong>Finalizar Viagem (Manual)</strong>
        <span>Limpar lotação de um autocarro</span>
      </div>
    </button>

    <button class="menu-card outline-card menu-card-danger" data-maestro-action="reportarSos"
      onclick="abrirModalSOS()">
      <span class="icon menu-card-icon-danger-bg">🚨</span>
      <div class="info">
        <strong>Reportar Avaria (SOS)</strong>
        <span>Aviso urgente à Secretaria e alunos</span>
      </div>
    </button>
  </div>

  <div id="menu-grupo-secretaria" class="hidden">
    <div class="divider-text mt-25">SECRETARIA E LOGÍSTICA</div>

    <button class="menu-card primary-card" data-maestro-action="gerirRotas" onclick="abrirModalSelecaoRota()">
      <span class="icon menu-card-icon-no-bg">🚌</span>
      <div class="info">
        <strong>Fluxo de Rotas (GPS)</strong>
        <span>Assumir Rastreio ou Finalizar Viagem</span>
      </div>
    </button>

    <button class="menu-card outline-card menu-card-primary" data-maestro-action="auditoria" onclick="abrirMesaAuditoria()">
      <span class="icon menu-card-icon-no-bg">📂</span>
      <div class="info">
        <strong>Mesa de Auditoria</strong>
        <span>Validar documentos e gerir matrículas</span>
      </div>
    </button>

    <button class="menu-card outline-card menu-card-info" data-maestro-action="comunicacao"
      onclick="abrirModalAvisosFiscal()">
      <span class="icon menu-card-icon-no-bg">📢</span>
      <div class="info">
        <strong>Central de Comunicação</strong>
        <span>Disparar avisos Push e Mural</span>
      </div>
    </button>

    <button class="menu-card outline-card" data-maestro-action="dashboard" onclick="carregarDashboard()">
      <span class="icon menu-card-icon-no-bg">📊</span>
      <div class="info">
        <strong>Painel Analítico</strong>
        <span>Estatísticas de uso e BI</span>
      </div>
    </button>
    <button class="menu-card outline-card menu-card-secondary" data-maestro-action="semestres" onclick="abrirGestaoSemestres()">
      <span class="icon menu-card-icon-no-bg">SEM</span>
      <div class="info">
        <strong>Gestao de Semestres</strong>
        <span>Criar, arquivar e definir o semestre atual</span>
      </div>
    </button>
  </div>

  <div id="menu-grupo-moderador" class="hidden">
    <div class="divider-text mt-25">ADMINISTRAÇÃO DO SISTEMA</div>

    <button class="menu-card dark-card menu-card-dark" data-maestro-action="salaMaquinas" onclick="abrirPainelModerador()">
      <span class="icon">⚙️</span>
      <div class="info">
        <strong>Sala das Máquinas</strong>
        <span>CRON, Motores e Gestão de Contas</span>
      </div>
    </button>
  </div>

  <button class="btn-text text-danger mt-20"
    onclick="encerrarSessaoOperador()">Sair do Sistema</button>
</section>

<div id="view-painel-motorista" class="view-section hidden">
  <div class="welcome-text">Central Logística do Motorista</div>

  <div class="grid-desktop">

  <button class="menu-card primary-card" data-maestro-action="motoristaRotas gerirRotas" onclick="abrirModalSelecaoRota()">
    <div class="icon">🚌</div>
    <div class="info">
      <strong>Fluxo de Rotas</strong>
      <span>Iniciar ou finalizar viagem rastreada</span>
    </div>
  </button>

  <button class="menu-card outline-card text-danger" data-maestro-action="reportarSos" onclick="abrirModalSOS()">
    <div class="icon">🚨</div>
    <div class="info">
      <strong class="text-danger">SOS Avaria</strong>
      <span>Reportar problemas na frota</span>
    </div>
  </button>

  <button class="menu-card dark-card" data-maestro-action="fiscalizar" onclick="abrirModoFiscalizacaoGlobal()">
    <div class="icon">📷</div>
    <div class="info">
      <strong>Modo Fiscalização</strong>
      <span>Ler QR Code do Estudante</span>
    </div>
  </button>
  </div>

  <div class="text-center mt-20 mb-20">
    <a href="#" onclick="encerrarSessaoOperador()" class="btn-text text-danger">Sair do Sistema</a>
  </div>
</div>
