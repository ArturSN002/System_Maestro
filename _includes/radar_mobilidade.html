<section id="view-radar" class="view-section split-view-desktop radar-view-shell">
    
    <div id="radar-lista-container" class="split-sidebar">
        <div class="radar-list-header">
            <h2 class="radar-list-title">Autocarros em Operação</h2>
        </div>
        <p class="radar-list-subtitle">Acompanhe os veículos e rotas em tempo real.</p>
        <div id="lista-viagens-cards">
            <div class="loader radar-list-loader"></div>
            <p class="radar-list-loading-text">A procurar viagens disponíveis...</p>
        </div>
        <div id="radar-voltar-footer">
            <button class="btn-voltar-red" onclick="switchView('view-wallet')">
                <span>⬅</span> Voltar à Carteira Digital
            </button>
        </div>
    </div>

    <div id="radar-mapa-container" class="hidden split-main radar-map-container">
        
        <div class="radar-map-topbar">
            <button class="hide-on-desktop radar-map-pill-button" onclick="fecharMapaVoltarLista()">
                ⬅ Voltar à Lista
            </button>
            <button class="btn-voltar radar-map-pill-button radar-map-wallet-button" onclick="switchView('view-wallet')">
                ⬅ Voltar
            </button>
            <div id="radar-status-bar" class="radar-status-bar">
                <span id="radar-status-text">A carregar...</span>
            </div>
        </div>

        <div id="mapa-paradas-container" class="radar-leaflet-host"></div>

        <button class="hide-on-desktop radar-locate-button" onclick="centralizarMapaEmMim()">🎯</button>
        
        <div id="painel-viagem-ativa" class="hidden radar-active-trip-panel"></div>
    </div>
</section>
