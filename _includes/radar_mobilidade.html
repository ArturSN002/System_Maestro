<section id="view-radar" class="view-section split-view-desktop radar-view-shell operational-view operational-radar-view student-v8-radar-view radar-v87-shell" data-component="MobilityRadar">
    
    <div id="radar-lista-container" class="split-sidebar operational-radar-list student-v8-radar-list radar-v87-list">
        <div class="radar-list-header operational-radar-list-header student-v8-radar-header radar-v87-list-header">
            <span class="student-v8-flow-icon" data-maestro-icon-slot="bus" aria-hidden="true"></span>
            <h2 class="radar-list-title">Autocarros em Operação</h2>
            <div class="radar-list-state-stack" aria-label="Estado do radar">
                <span id="radar-network-state" class="admin-context-chip admin-context-chip-muted">Rede</span>
                <span id="radar-gps-state" class="admin-context-chip admin-context-chip-muted">GPS</span>
            </div>
        </div>
        <p class="radar-list-subtitle">Acompanhe os veículos e rotas em tempo real.</p>
        <div class="radar-v87-priority-strip">
            <span data-maestro-icon-slot="mapPin" aria-hidden="true"></span>
            <strong>Mapa prioritario</strong>
            <span>Selecione uma viagem para acompanhar rota, paradas e sinal GPS.</span>
        </div>
        <div id="lista-viagens-cards" class="operational-radar-trips">
            <div class="loader radar-list-loader"></div>
            <p class="radar-list-loading-text">A procurar viagens disponíveis...</p>
        </div>
        <div id="radar-voltar-footer" class="operational-radar-footer">
            <button class="btn-voltar-red" onclick="switchView('view-wallet')">
                <span data-maestro-icon-slot="arrowLeft" aria-hidden="true"></span> Voltar à Carteira Digital
            </button>
        </div>
    </div>

    <div id="radar-mapa-container" class="hidden split-main radar-map-container operational-radar-map student-v8-radar-map radar-v87-map-priority">
        
        <div class="radar-map-topbar operational-radar-topbar radar-v87-map-topbar">
            <button class="hide-on-desktop radar-map-pill-button" onclick="fecharMapaVoltarLista()">
                <span data-maestro-icon-slot="arrowLeft" aria-hidden="true"></span> Voltar à Lista
            </button>
            <button class="btn-voltar radar-map-pill-button radar-map-wallet-button" onclick="switchView('view-wallet')">
                <span data-maestro-icon-slot="arrowLeft" aria-hidden="true"></span> Voltar
            </button>
            <div id="radar-status-bar" class="radar-status-bar">
                <span id="radar-status-text">A carregar...</span>
            </div>
        </div>

        <div id="mapa-paradas-container" class="radar-leaflet-host"></div>

        <button class="hide-on-desktop radar-locate-button operational-locate-button" onclick="centralizarMapaEmMim()" aria-label="Centralizar mapa na minha localização"><span data-maestro-icon-slot="locate" aria-hidden="true"></span></button>
        
        <div id="painel-viagem-ativa" class="hidden radar-active-trip-panel radar-v87-bottom-sheet"></div>
    </div>
</section>
